<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>İyi ki Doğdun Aşkımmm ❤️</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-handwriting { font-family: 'Caveat', cursive; }
    
    /* Uçuşan Kalpler */
    @keyframes floatUp {
      0% { transform: translateY(105vh) scale(0.6); opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.1); opacity: 0; }
    }
    .heart-bg {
      position: fixed;
      bottom: -30px;
      animation: floatUp 6s linear infinite;
      z-index: 0;
      pointer-events: none;
      user-select: none;
    }

    /* Kaçan Buton Geçişi */
    #kacanButon {
      transition: left 0.18s ease-out, top 0.18s ease-out, transform 0.2s ease;
      touch-action: none;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-rose-50 via-pink-50 to-rose-100 text-slate-800 min-h-screen relative overflow-x-hidden selection:bg-rose-200 flex flex-col justify-between p-4">

  <!-- Uçuşan Kalp Efekti -->
  <div id="heartContainer"></div>

  <!-- Müzik Çalar (Klasörde sarkimiz.mp3 varsa çalar) -->
  <audio id="bgMusic" loop src="sarkimiz.mp3"></audio>
  <div class="fixed top-3 right-3 z-50">
    <button onclick="muzikCal()" id="musicBtn" class="bg-white/80 backdrop-blur-md px-3 py-1.5 rounded-full border border-rose-200 shadow-sm text-xs font-bold text-rose-600 hover:bg-white transition active:scale-95">
      <span id="musicIcon">🎵</span> <span id="musicText">Şarkımız</span>
    </button>
  </div>

  <div class="max-w-md mx-auto w-full my-auto text-center space-y-6 relative z-10 py-6">

    <!-- BAŞLIK -->
    <div class="space-y-1">
      <span class="inline-block bg-rose-200 text-rose-700 px-3 py-1 rounded-full text-xs font-black tracking-wider uppercase">
        ✨ 1 NUMARALI GÜN ✨
      </span>
      <h1 class="text-3xl sm:text-4xl font-black text-rose-950 tracking-tight">
        İyi ki doğdun aşkımmm ❤️
      </h1>
      <p class="text-xs text-rose-600 font-bold">
        Dünyanın en güzel kalpli insanı, iyi ki varsın!
      </p>
    </div>

    <!-- MERKEZDEKİ TEK FOTOĞRAF -->
    <div class="relative inline-block mx-auto">
      <div class="w-64 h-64 sm:w-72 sm:h-72 p-3 bg-white rounded-3xl shadow-2xl border-4 border-rose-200 transform -rotate-1 hover:rotate-0 transition duration-300">
        <div class="w-full h-full rounded-2xl overflow-hidden bg-rose-100">
          <img src="foto.jpg" onerror="this.src='https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=600&auto=format&fit=crop&q=80'" class="w-full h-full object-cover">
        </div>
      </div>
      <div class="absolute -bottom-3 -right-2 bg-rose-500 text-white text-xs font-extrabold px-3 py-1 rounded-full shadow-lg">
        Ömrüm 💕
      </div>
    </div>

    <!-- OYUN ALANI -->
    <div id="oyunAlaniKutusu" class="bg-white/80 backdrop-blur-md rounded-3xl p-5 border border-rose-200 shadow-lg space-y-3">
      <div class="text-3xl animate-bounce">🎁</div>
      <h2 id="oyunMesaj" class="text-base font-extrabold text-slate-900">
        Sana küçük bir hediyem var!
      </h2>
      <p id="ipucuYazi" class="text-xs text-slate-500 font-semibold">
        Aşağıdaki butona tıkla ve hediyeni aç:
      </p>

      <!-- Butonun Kaçacağı Güvenli Kutu -->
      <div id="gameBoundary" class="relative w-full h-36 bg-rose-50/50 rounded-2xl border border-dashed border-rose-300 flex items-center justify-center overflow-hidden">
        <button id="kacanButon" class="absolute bg
